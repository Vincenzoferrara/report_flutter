name: report_flutter
description: >-
  Flutter library to design, preview and print labels and reports: drag-and-drop
  designer, paper formats, barcodes, QR codes and PDF export.
version: 1.0.1
homepage: https://github.com/Vincenzoferrara/report_flutter
repository: https://github.com/Vincenzoferrara/report_flutter
issue_tracker: https://github.com/Vincenzoferrara/report_flutter/issues
funding:
  - https://ko-fi.com/vinc0101
topics:
  - pdf
  - printing
  - labels
  - report
  - barcode

screenshots:
  - description: 'Print preview of a sheet of labels'
    path: doc/screenshots/preview_sheet.png
  - description: 'Print preview of a single label'
    path: doc/screenshots/preview_label.png
  - description: 'Print center with the templates by category'
    path: doc/screenshots/print_center.png
  - description: 'Paper format choice in the print screen'
    path: doc/screenshots/paper_choice.png
  - description: 'Templates tab'
    path: doc/screenshots/templates.png
  - description: 'Template menu: edit, rename, duplicate, move, delete'
    path: doc/screenshots/template_menu.png
  - description: 'Template designer with rulers and element palette'
    path: doc/screenshots/designer.png
  - description: 'Properties panel of a selected element'
    path: doc/screenshots/designer_properties.png
  - description: 'Ready-made paper formats'
    path: doc/screenshots/paper_formats.png
  - description: 'New paper format dialog'
    path: doc/screenshots/new_paper_format.png

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Number and date formatting, and the library translations
  intl: ^0.20.3

  # PDF generation
  pdf: ^3.12.0
  printing: ^5.14.3

  # QR Code generation
  qr_flutter: ^4.1.0

  # File picker for template management
  file_picker: ^13.1.0

  # Path provider for file operations
  path_provider: ^2.1.6

  # Shared preferences for settings
  shared_preferences: ^2.5.5

  # CSV parsing for data import
  csv: ^8.0.0

  # Excel export
  excel: ^4.0.6

  # File operations
  path: ^1.9.1

  # Markdown rendering
  markdown_widget: ^2.3.2+8

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # Generates ReportLocalizations from lib/l10n (see l10n.yaml).
  generate: true

  uses-material-design: true

  assets:
    - assets/templates/
    # Latin subsets of Noto Sans/Serif (SIL OFL, see assets/fonts/OFL.txt):
    # the standard PDF fonts have no euro sign.
    - assets/fonts/
